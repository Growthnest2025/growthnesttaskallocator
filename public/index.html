<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowthNest Tech Solutions - Student Learning & Task Portal | Tirunelveli</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.png" type="image/png">
</head>
<body>

  <!-- Sleek Dark Branding Header Matching Official GrowthNest Logo -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-badge" onclick="app.showHome()" title="GrowthNest Tech Solutions">
        <img src="logo.png" alt="GrowthNest Logo" class="brand-logo-img">
        <div class="brand-name">GrowthNest <span class="brand-accent">Tech Solutions</span></div>
      </div>
      <nav id="headerUserStrip" class="nav-links-group">
        <!-- Rendered by app.js: Clean User pill + Sign Out -->
      </nav>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="container" id="appRoot">
    <div style="text-align: center; padding: 60px 20px;">
      <p style="color: var(--text-muted);">Loading GrowthNest Task Portal...</p>
    </div>
  </main>

  <!-- Add Student Modal (for Admin) -->
  <div id="addStudentModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:18px; color:var(--dark-navy); display:flex; align-items:center; gap:8px;">
          <span style="color:var(--emerald);">➕</span> Enroll New Student
        </h3>
        <button style="background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-muted);" onclick="app.closeModal('addStudentModal')">&times;</button>
      </div>
      <form onsubmit="app.handleAdminEnroll(event)">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="addName" class="form-input" required placeholder="e.g. Ramesh Kumar">
        </div>
        <div class="form-group">
          <label>Username * (Login ID)</label>
          <input type="text" id="addUsername" class="form-input" required placeholder="e.g. ramesh25">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="addPassword" class="form-input" required placeholder="Create initial password">
        </div>
        <div class="form-group">
          <label>Real Joining Date * (Time elapsed starts from this date)</label>
          <input type="date" id="addJoiningDate" class="form-input" required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="app.closeModal('addStudentModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Enroll & Allocate Task 1</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Screenshot Zoom Modal -->
  <div id="imagePreviewModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1100; align-items:center; justify-content:center; padding:20px;" onclick="app.closeModal('imagePreviewModal')">
    <div style="max-width:900px; max-height:90vh; position:relative;" onclick="event.stopPropagation()">
      <button style="position:absolute; top:-36px; right:0; background:none; border:none; color:white; font-size:28px; cursor:pointer;" onclick="app.closeModal('imagePreviewModal')">&times;</button>
      <img id="previewModalImg" src="" alt="Submission Screenshot" style="max-width:100%; max-height:85vh; border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.5);">
    </div>
  </div>

  <footer>
    <strong>GrowthNest Tech Solutions</strong> &bull; Real-Time Software Training & Student Task Allocation Engine<br>
    <span style="font-size: 11.5px; opacity: 0.85;">Tirunelveli, Tamil Nadu &bull; High-Performance Student Portal &bull; 2026</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
